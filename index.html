<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeatBXT</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: #eee; }
    header { background: #1e1e1e; padding: 2rem; text-align: center; }
    header h1 { margin: 0; font-size: 2.5rem; }
    .section { padding: 2rem; max-width: 800px; margin: auto; }
    .cta { background: #222; padding: 2rem; text-align: center; margin-top: 2rem; }
    .cta input, .cta button { padding: 0.5rem; margin: 0.5rem; }
    .audio-player { margin: 1rem 0; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    form input, form textarea { padding: 0.75rem; background: #333; color: white; border: none; border-radius: 5px; }
    form button { background: #00ffaa; color: #000; padding: 0.75rem; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>BeatBXT</h1>
    <p>Custom AI Beats. Real Producer Power.</p>
  </header>

  <section class="section">
    <h2>Submit Your Custom Beat Request</h2>
    <form action="https://formspree.io/f/xeogewjl" method="POST">
      <input type="text" name="email" placeholder="Your Email" required>
      <textarea name="description" placeholder="Describe your beat: mood, genre, tempo, artist inspiration" required></textarea>
      <label>
        <input type="checkbox" name="tutorial"> I want a step-by-step DAW walkthrough
      </label>
      <button type="submit">Send Request</button>
    </form>
  </section>

  <section class="section">
    <h2>Beat of the Week</h2>
    <div class="audio-player">
      <p><em>Coming soon — our first featured beat will drop here with a breakdown tutorial.</em></p>
    </div>
  </section>

  <section class="cta">
    <h2>Get Weekly Free Beats + Tutorials</h2>
    <form action="https://formspree.io/f/xeogewjl" method="POST">
      <input type="email" name="email" placeholder="Enter your email">
      <button type="submit">Subscribe</button>
    </form>
  </section>

</body>
</html>
